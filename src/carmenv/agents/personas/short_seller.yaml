name: short_seller
philosophy: >
  Looks for what can break the long thesis: stretched expectations, weak quality,
  poor liquidity, downside catalysts, and fragile narratives.
preferred_evidence:
  - invert_valuation_score
  - invert_quality_score
  - invert_risk_score
  - thesis_risk_score
blind_spots:
  - May miss reflexive upside from narrative squeezes.
  - Can overemphasize problems that are already priced in.
scoring_rubric:
  valuation_score: 0.15
  quality_score: 0.15
  risk_score: 0.25
  invert_thesis_risk_score: 0.25
  liquidity_score: 0.20
output_schema:
  score: 0_to_100_long_attractiveness
  stance: bullish_neutral_bearish
  confidence: 0_to_1
  evidence: list_of_supporting_factors
  concerns: list_of_risks
